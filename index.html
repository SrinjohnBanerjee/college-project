<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phishing Website Detection</title>
    <style>
        /* --- Reset & Base Styles --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #ffffff; 
            color: #333; 
            line-height: 1.6;
        }

        /* --- Layout Container --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- Header & Logo --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 0;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            color: #000;
        }
        nav a {
            margin-left: 2rem;
            text-decoration: none;
            font-weight: 600;
            color: #4b5563;
            transition: 0.2s;
        }
        nav a:hover { color: #6366f1; }

        /* --- Hero Section --- */
        .hero {
            padding: 4rem 0;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            color: #1f2937;
        }
        .description {
            max-width: 700px;
            margin: 0 auto 2rem;
            color: #6b7280;
            font-size: 1.125rem;
        }

        /* --- The Prediction Output (Your {{predict}} line) --- */
        #predictOutput {
            margin: 1.5rem auto;
            max-width: 768px;
            text-align: center;
            font-weight: bold;
            color: #10b981; /* Success Green */
            min-height: 1.5rem;
        }
        @media (min-width: 768px) {
            #predictOutput { font-size: 1.25rem; }
        }

        /* --- Detection Input Area --- */
        .input-wrapper {
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #374151;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            background-color: #f9fafb;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        input[type="text"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        /* --- Footer --- */
        footer {
            margin-top: 5rem;
            padding: 2rem 0;
            border-top: 1px solid #e5e7eb;
            text-align: center;
            color: #9ca3af;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="/" class="logo">Phishng Detection</a>
            <nav>
                <a href="#">Home</a>
                <a href="#">Detection</a>
                <a href="#">About</a>
            </nav>
        </header>

        <section class="hero">
            <h1>Phishng Website Detection</h1>
            <p class="description">
                Enter a website URL below. Our system uses machine learning to analyze the link 
                and determine if it is a phishing threat in real-time.
            </p>

            <div class="input-wrapper">
                <label for="url">Enter Website URL</label>
                <input name="url" id="url" type="text" placeholder="Paste link here (e.g., https://example.com)" autofocus autocomplete="off">
            </div>

            <p id="predictOutput"></p>
        </section>
    </div>

    <footer>
        &copy; 2024 Phishng Website Detection College Project
    </footer>

    <script>
        const urlInput = document.getElementById('url');
        const outputElement = document.getElementById('predictOutput');
        let typingTimer;
        const doneTypingInterval = 600; // Wait 0.6s after user stops typing

        urlInput.addEventListener('input', () => {
            clearTimeout(typingTimer);
            outputElement.innerText = "Analyzing features...";
            outputElement.style.color = "#6366f1"; // Set to blue while processing

            if (urlInput.value.trim().length > 5) {
                typingTimer = setTimeout(performDetection, doneTypingInterval);
            } else {
                outputElement.innerText = "";
            }
        });

        async function performDetection() {
            const urlValue = urlInput.value.trim();

            try {
                const response = await fetch('/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ 'url': urlValue })
                });

                const data = await response.json();
                outputElement.innerText = data.predict;
                outputElement.style.color = "#10b981"; // Change back to green for result

            } catch (error) {
                outputElement.innerText = "Error: Backend not responding.";
                outputElement.style.color = "#ef4444"; // Red for error
            }
        }
    </script>
</body>
</html>
